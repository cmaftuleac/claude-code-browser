name: Release host to npm

# Publishes apps/host (the `claude-code-browser` npm package).
#
# Normal path: push a version tag — `git tag v0.1.20 && git push origin v0.1.20`.
# The tag MUST match apps/host/package.json:version; the job fails fast otherwise,
# because npm versions are immutable and a wrong publish cannot be undone.
#
# Auth is npm **trusted publishing** (OIDC) — no NPM_TOKEN secret. The package must
# list this repo + this workflow file as a trusted publisher on npmjs.com; npm then
# mints a short-lived credential from the `id-token` below, and provenance is
# attached automatically. Nothing secret ever lives in the repo.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack, but do not publish'
        type: boolean
        default: true

concurrency:
  # One release at a time; never cancel a publish midway.
  group: release-host
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Load-bearing: this is the credential. Trusted publishing exchanges this
      # OIDC token for a short-lived npm publish grant, and it also backs provenance.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          # NO registry-url. It makes setup-node write an .npmrc containing
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # which, with no token in the environment, resolves to an EMPTY token that
          # is still sent — shadowing the OIDC credential and failing the publish with
          # a misleading `E404 PUT` (npm reports unauthorized as 404). The default
          # registry is registry.npmjs.org anyway, so this option buys nothing here.

      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        # Node 22 bundles npm 10.x, which has no OIDC support and would fall back to
        # looking for a token that does not exist. Pin the major so a future npm
        # cannot change publish behaviour under us without a deliberate bump.
        run: |
          npm install -g npm@^12
          npm -v

      - name: Install workspace
        run: npm ci

      - name: Build all workspaces
        # Builds packages/shared first (turbo dependsOn ^build) — apps/host's tsc
        # resolves the shared types through its built dist, so order matters.
        run: npm run build

      - name: Resolve version
        id: v
        run: |
          VERSION=$(node -p "require('./apps/host/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="${{ steps.v.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/host/package.json version $PKG."
            echo "::error::Retag, or bump the package — an npm version cannot be republished."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package version $PKG."

      - name: Check the version is not already published
        # Fatal for a real release (npm versions are immutable), but only a warning
        # on a dry run — a dry run publishes nothing, so refusing to validate the
        # build just because the version exists makes the dry run useless.
        run: |
          PKG="${{ steps.v.outputs.version }}"
          if npm view "claude-code-browser@$PKG" version >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "::warning::claude-code-browser@$PKG is already published — fine for a dry run, fatal for a release."
            else
              echo "::error::claude-code-browser@$PKG is already on npm. Versions are immutable — bump and retag."
              exit 1
            fi
          else
            echo "claude-code-browser@$PKG is not published yet."
          fi

      - name: Pack (inspect contents)
        run: |
          npm pack -w apps/host --pack-destination /tmp
          echo "--- tarball contents ---"
          tar -tzf /tmp/claude-code-browser-${{ steps.v.outputs.version }}.tgz | head -40

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        # No NODE_AUTH_TOKEN: an empty/absent token env would shadow OIDC and fail
        # with ENEEDAUTH. Provenance is implied by trusted publishing but stated
        # explicitly so a config regression fails loudly instead of silently
        # publishing an unattested tarball.
        run: npm publish -w apps/host --access public --provenance

      - name: Dry run — skipped publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        # Block scalar: an inline `run:` whose text contains ": " reads as a nested
        # mapping and makes the whole workflow file invalid.
        run: |
          echo "Dry run — built and packed v${{ steps.v.outputs.version }}, publish skipped."

      - name: Summary
        run: |
          {
            echo "### claude-code-browser v${{ steps.v.outputs.version }}"
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.dry_run }}" = "false" ]; then
              echo "Published to npm."
            else
              echo "Dry run — nothing published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# electron-builder packaging config for Fineguide Tesseract (the Electron desktop build).
# Icons are read from build/ (icon.icns for macOS, icon.ico for Windows, icon.png
# for Linux) — all generated from the source artwork in that folder.
#
# Run after `electron-vite build` (see the `package`/`package:dir` npm scripts).
appId: ai.fineguide.tesseract
productName: Fineguide Tesseract
copyright: © Fineguide.AI

# In this npm-workspaces monorepo `electron` is hoisted to the repo-root
# node_modules and pinned only by range (^33.0.0), so electron-builder can't
# infer the version from apps/desktop. Declare it explicitly. Keep in sync with
# the `electron` devDependency in package.json.
electronVersion: 33.4.11

directories:
  buildResources: build
  output: release

# The renderer/preload/main are emitted to dist/ by electron-vite; package.json
# (main → dist/main/index.js) is included automatically.
files:
  - dist/**
  - "!**/*.map"

# Auto-update feed. The code repo is private, so releases are published to a
# SEPARATE PUBLIC repo (opentech-dev/tesseract-release) — only signed binaries
# + the latest*.yml manifests live there. electron-updater reads them with no
# token (public), so nothing secret is embedded in the shipped app.
publish:
  provider: github
  owner: opentech-dev
  repo: tesseract-release

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # zip is REQUIRED for macOS auto-update (Squirrel.Mac can't apply a dmg); dmg
  # is the first-run download. Both are uploaded to the release.
  target:
    - dmg
    - zip
  # Hardened runtime + entitlements + notarization — without these a signed app
  # still won't pass Gatekeeper, and electron-updater can't apply the update.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

win:
  icon: build/icon.ico
  target:
    - nsis

nsis:
  # Differential downloads: ship only the changed blocks on update (the .blockmap
  # is generated automatically), and keep the install seamless.
  differentialPackage: true
  oneClick: true
  perMachine: false

linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage

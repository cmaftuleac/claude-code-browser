<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Relaxed for the local IDE: Monaco needs blob: workers and inline styles. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: media-file:; media-src 'self' media-file: blob: http: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws: http: https:" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fineguide Tesseract</title>
    <!-- Apply the saved theme to <html> DURING PARSE, before any CSS paints. The
         preload exposes window.__ccbAppearance synchronously; running this here
         (not in the preload) guarantees document.documentElement exists. Setting
         data-theme now means the critical <style> below — and the app CSS — paint
         the correct theme on the very first frame (no light→dark flash). -->
    <script>
      (function () {
        try {
          var a = window.__ccbAppearance;
          if (a) {
            var r = document.documentElement;
            if (a.theme) r.dataset.theme = a.theme;
            if (a.density) r.dataset.density = a.density;
            if (a.accent) r.style.setProperty('--accent', a.accent);
          }
        } catch (e) { /* settings-store applies appearance shortly after */ }
      })();
    </script>
    <!-- Critical first-paint background, before the app CSS (a <link> in the
         packaged build, JS-injected by Vite in dev) so neither mode flashes the
         browser's default white canvas. data-theme is already set by the script
         above. Keep in sync with the --page-bg tokens in styles.css. -->
    <style>
      /* Default = transparent so the native window backdrop (set per-theme by the
         main process via themeBackground()) shows through until the theme + app CSS
         paint — correct for any theme, never a white UA canvas. The script above
         normally sets data-theme first, so a concrete rule below wins immediately. */
      html { background: transparent; }
      html[data-theme="claude"] { background: #faf7f2; }
      html[data-theme="white"]  { background: #ffffff; }
      html[data-theme="dark"]   { background: #14120d; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

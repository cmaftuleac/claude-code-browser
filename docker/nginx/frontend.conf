# Frontend container — serves the static SPA. It never sees /ws, /fs, /recents
# or /health; the gateway routes those to the backend before they reach here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets — cache hard.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths return index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

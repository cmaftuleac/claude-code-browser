# Public entrypoint (prod). The only container with a published port.
# More-specific locations win in nginx, so API/WS routes match before the `/`
# catch-all → the SPA fallback can never swallow an API route.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ccb_backend  { server backend:9315; }
upstream ccb_frontend { server frontend:80;  }
upstream ccb_api      { server api:9320;     }

server {
    listen 8080;
    server_name _;

    # Headroom for /fs/writeFile + base64 copy/move; the server enforces its own caps.
    client_max_body_size 512m;

    # Cloud API (auth, accounts) → the NestJS service. More-specific than `/`.
    location /auth/ {
        proxy_pass http://ccb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Federated profile + plan writes (fineguide.ai contract) → the NestJS service.
    location /fineguide/ {
        proxy_pass http://ccb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App WebSocket — Upgrade/Connection + HTTP/1.1 are mandatory or the
    # handshake hangs and the SPA shows "disconnected". Long agent streams need
    # the raised timeouts.
    location /ws {
        proxy_pass http://ccb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Filesystem API. /fs/stream serves media with HTTP Range → buffering off so
    # seeking works and large media isn't buffered into nginx.
    location /fs/ {
        proxy_pass http://ccb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /recents { proxy_pass http://ccb_backend; proxy_set_header Host $host; }
    location = /health  { proxy_pass http://ccb_backend; proxy_set_header Host $host; }

    # Everything else → the frontend SPA container.
    location / {
        proxy_pass http://ccb_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

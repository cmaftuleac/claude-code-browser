# Public entrypoint (dev). Same as gateway.conf except the frontend upstream is
# the Vite dev server (5173) and the `/` block also carries Upgrade/Connection so
# Vite's HMR websocket proxies through. The app's own /ws still routes to backend.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ccb_backend  { server backend:9315; }
upstream ccb_frontend { server frontend:5173; }
upstream ccb_api      { server api:9320;     }

server {
    listen 8080;
    server_name _;

    client_max_body_size 512m;

    # Cloud API (auth, accounts) → the NestJS service. More-specific than `/`.
    location /auth/ {
        proxy_pass http://ccb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Federated profile + plan writes (fineguide.ai contract) → the NestJS service.
    location /fineguide/ {
        proxy_pass http://ccb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://ccb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /fs/ {
        proxy_pass http://ccb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /recents { proxy_pass http://ccb_backend; proxy_set_header Host $host; }
    location = /health  { proxy_pass http://ccb_backend; proxy_set_header Host $host; }

    # SPA + Vite HMR websocket → the Vite dev server. Upgrade headers let HMR connect.
    location / {
        proxy_pass http://ccb_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

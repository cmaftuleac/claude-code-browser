# Hot-reload override — keeps the same gateway+frontend+backend topology, but
# swaps the built images for watchers over bind-mounted source.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Both app services reuse the `deps` build stage (the Linux node_modules from
# `npm ci`) and bind-mount source, shadowing node_modules with anonymous volumes
# so the host's macOS/arm64 node_modules can't clobber the container's Linux one.
# App healthchecks are disabled (dev compile time makes them flaky); the gateway
# only waits for the containers to start and self-heals once the dev servers are up.
#
# Note: editing packages/shared or packages/agent-core needs a backend restart
# (they're compiled once at startup); editing apps/server or apps/desktop is live.

services:
  # db is inherited from the base file (real Postgres) — no override needed.

  api:
    build:
      target: deps
    working_dir: /repo
    # push schema to db (creates tables), then nest start --watch (which also runs prisma generate)
    command: sh -c "npm run build -w packages/shared && npm run prisma:push -w apps/api && npm run dev -w apps/api"
    volumes:
      - ./packages/shared:/repo/packages/shared
      - ./apps/api:/repo/apps/api
      - /repo/node_modules
      - /repo/apps/api/node_modules
    healthcheck:
      disable: true

  backend:
    build:
      target: deps
    working_dir: /repo
    command: sh -c "npm run build -w packages/shared && npm run build -w packages/agent-core && npm run dev -w apps/server"
    volumes:
      - ./packages:/repo/packages
      - ./apps/server:/repo/apps/server
      - ./workspace:/workspace
      - /repo/node_modules
    healthcheck:
      disable: true

  frontend:
    build:
      target: deps
    working_dir: /repo
    command: sh -c "npm run dev:web -w apps/desktop"
    environment:
      GATEWAY_PORT: "${GATEWAY_PORT:-8080}" # → vite hmr.clientPort, so HMR dials the gateway
    volumes:
      - ./apps/desktop:/repo/apps/desktop
      - ./packages/shared:/repo/packages/shared
      - /repo/node_modules
      - /repo/apps/desktop/node_modules
    healthcheck:
      disable: true

  gateway:
    volumes:
      # Shadows the baked prod conf with the dev one (frontend → vite:5173 + HMR ws).
      - ./docker/nginx/gateway.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      api:
        condition: service_started
